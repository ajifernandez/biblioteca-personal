{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h1>Escanear código de barras</h1>
  <p>Apunta la cámara al código ISBN de la contraportada.</p>
</div>

<label class="autosave-toggle" style="display:flex; align-items:center; gap:0.5rem; justify-content:center; margin-bottom:1rem;">
  <input type="checkbox" id="autosave-toggle">
  Guardado automático (si se encuentra título, guarda y sigue escaneando)
</label>

<div class="field full" style="max-width:380px; margin:0 auto 1rem;">
  <label>Ubicación de los libros que vas a escanear</label>
  <input type="text" name="location" id="f-location" form="book-form" list="location-suggestions" placeholder="ej. Salón, estante 2">
  <datalist id="location-suggestions"></datalist>
</div>

<div class="scan-frame" id="scan-frame">
  <div id="reader"></div>
</div>
<p class="scan-status" id="scan-status">Iniciando cámara...</p>
<div class="lookup-links" id="isbn-search-links" style="display:none;"></div>
<div style="text-align:center; margin-bottom:1.5rem;">
  <button id="restart-scan" class="btn btn-ghost" style="display:none;">🔄 Escanear otro</button>
  <button id="manual-isbn-btn" type="button" class="btn btn-ghost">✏️ Escribir ISBN a mano</button>
</div>

<form id="manual-isbn-form" class="card" style="display:none;">
  <div class="field full">
    <label>ISBN</label>
    <input type="text" id="manual-isbn-input" inputmode="numeric" placeholder="Ej. 9788420412146">
  </div>
  <button type="submit" class="btn btn-primary btn-block">Buscar</button>
</form>

<form id="book-form" class="card" method="post" action="{{ url_for('create_book') }}" enctype="multipart/form-data" style="display:none;">
  <div class="form-grid">
    <div class="field full">
      <label>Código de barras (ISBN)</label>
      <input type="text" name="isbn" id="f-isbn" readonly>
    </div>
    <div class="field full">
      <label>Título *</label>
      <input type="text" name="title" id="f-title" required>
    </div>
    <div class="field">
      <label>Autor</label>
      <input type="text" name="author" id="f-author">
    </div>
    <div class="field">
      <label>Editorial</label>
      <input type="text" name="publisher" id="f-publisher">
    </div>
    <div class="field">
      <label>Año</label>
      <input type="text" name="published_year" id="f-year">
    </div>
    <div class="field full">
      <label>Portada</label>
      <div style="display:flex; gap:0.75rem; align-items:flex-start;">
        <img id="cover-preview" alt="" style="width:60px;height:90px;object-fit:cover;border-radius:8px;background:var(--border);display:none;">
        <div style="flex:1;">
          <input type="file" name="cover_file" id="f-cover-file" accept="image/*" capture="environment">
          <input type="text" name="cover_url" id="f-cover" placeholder="o pega una URL de imagen" style="margin-top:0.5rem;">
        </div>
      </div>
    </div>
  </div>
  <input type="hidden" name="description" id="f-description">
  <button type="submit" class="btn btn-primary btn-block">Guardar libro</button>
</form>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="{{ url_for('static', filename='isbn-lookup.js') }}"></script>
<script>
  const reader = new Html5Qrcode("reader", { formatsToSupport: [Html5QrcodeSupportedFormats.EAN_13] });
  const frame = document.getElementById("scan-frame");
  const status = document.getElementById("scan-status");
  const form = document.getElementById("book-form");
  const restartBtn = document.getElementById("restart-scan");
  const manualBtn = document.getElementById("manual-isbn-btn");
  const manualForm = document.getElementById("manual-isbn-form");
  const manualInput = document.getElementById("manual-isbn-input");
  const searchLinks = document.getElementById("isbn-search-links");
  const coverFile = document.getElementById("f-cover-file");
  const coverUrlInput = document.getElementById("f-cover");
  const coverPreview = document.getElementById("cover-preview");
  const locationInput = document.getElementById("f-location");
  const locationSuggestions = document.getElementById("location-suggestions");
  const autosaveToggle = document.getElementById("autosave-toggle");

  autosaveToggle.checked = localStorage.getItem("autosaveEnabled") === "1";
  autosaveToggle.addEventListener("change", () => {
    localStorage.setItem("autosaveEnabled", autosaveToggle.checked ? "1" : "0");
  });

  const lastLocation = localStorage.getItem("lastLocation");
  if (lastLocation) locationInput.value = lastLocation;
  locationInput.addEventListener("input", () => {
    localStorage.setItem("lastLocation", locationInput.value);
  });

  fetch("/api/locations")
    .then((res) => res.json())
    .then((names) => {
      locationSuggestions.innerHTML = names
        .map((name) => `<option value="${name.replace(/"/g, "&quot;")}">`)
        .join("");
    })
    .catch(() => {});

  function showCoverPreview(src) {
    if (src) {
      coverPreview.src = src;
      coverPreview.style.display = "block";
    } else {
      coverPreview.style.display = "none";
    }
  }

  coverFile.addEventListener("change", () => {
    if (coverFile.files[0]) showCoverPreview(URL.createObjectURL(coverFile.files[0]));
  });
  coverUrlInput.addEventListener("input", () => {
    if (!coverFile.files[0]) showCoverPreview(coverUrlInput.value);
  });

  function stopScanner() {
    reader.stop().catch(() => {});
  }

  function showSearchLinks(links) {
    searchLinks.innerHTML = "";
    if (!links || links.length === 0) {
      searchLinks.style.display = "none";
      return;
    }
    const title = document.createElement("p");
    title.textContent = "Buscar este ISBN en internet:";
    searchLinks.appendChild(title);
    for (const link of links) {
      const anchor = document.createElement("a");
      anchor.className = "tag";
      anchor.href = link.url;
      anchor.target = "_blank";
      anchor.rel = "noopener noreferrer";
      anchor.textContent = link.label;
      searchLinks.appendChild(anchor);
    }
    searchLinks.style.display = "block";
  }

  function startScanner() {
    frame.style.display = "block";
    restartBtn.style.display = "none";
    manualBtn.style.display = "inline-flex";
    manualForm.style.display = "none";
    manualInput.value = "";
    form.style.display = "none";
    showSearchLinks([]);
    status.className = "scan-status pulse";
    status.textContent = "Buscando código de barras...";
    reader.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 120 } },
      onScanSuccess
    );
  }

  async function autoSaveBook() {
    const formData = new FormData(form);
    const res = await fetch(form.action, {
      method: "POST",
      body: formData,
      headers: { "X-Requested-With": "XMLHttpRequest" },
    });
    if (!res.ok) throw new Error("save failed");
    return res.json();
  }

  async function onScanSuccess(isbn) {
    stopScanner();
    frame.style.display = "none";
    restartBtn.style.display = "inline-flex";
    manualBtn.style.display = "none";
    manualForm.style.display = "none";
    status.className = "scan-status active";
    status.textContent = `Código detectado: ${isbn}. Buscando información...`;

    document.getElementById("f-isbn").value = isbn;

    try {
      const data = await lookupIsbnProgressive(isbn, {
        onStatus: (msg) => { status.textContent = msg; },
      });
      showSearchLinks(await fetchIsbnSearchLinks(isbn));
      if (data && data.found) {
        document.getElementById("f-title").value = data.title || "";
        document.getElementById("f-author").value = data.author || "";
        document.getElementById("f-publisher").value = data.publisher || "";
        document.getElementById("f-year").value = data.published_year || "";
        document.getElementById("f-cover").value = data.cover_url || "";
        document.getElementById("f-description").value = data.description || "";
        showCoverPreview(data.cover_url || "");

        if (autosaveToggle.checked && data.title) {
          status.textContent = "💾 Guardando automáticamente...";
          try {
            await autoSaveBook();
            status.textContent = `✅ Guardado: ${data.title}`;
            setTimeout(startScanner, 900);
            return;
          } catch (e) {
            status.textContent = "Error al guardar automáticamente. Revisa los datos y guarda a mano.";
          }
        } else {
          status.textContent = data.source
            ? `✅ Libro encontrado en ${data.source}. Revisa los datos y añade la ubicación.`
            : "✅ Libro encontrado. Revisa los datos y añade la ubicación.";
        }
      } else {
        status.textContent = "No se encontró información automática. "
          + "Puedes buscar el ISBN fuera y rellenar los datos a mano.";
      }
    } catch (e) {
      showSearchLinks([]);
      status.textContent = "Error buscando información. Rellena los datos a mano.";
    }
    form.style.display = "block";
  }

  restartBtn.addEventListener("click", startScanner);

  manualBtn.addEventListener("click", () => {
    stopScanner();
    frame.style.display = "none";
    manualBtn.style.display = "none";
    restartBtn.style.display = "inline-flex";
    manualForm.style.display = "block";
    status.className = "scan-status";
    status.textContent = "Escribe el ISBN que aparece impreso en el libro.";
    manualInput.focus();
  });

  manualForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const isbn = manualInput.value.trim();
    if (!isbn) return;
    manualForm.style.display = "none";
    onScanSuccess(isbn);
  });

  startScanner();
</script>
{% endblock %}
