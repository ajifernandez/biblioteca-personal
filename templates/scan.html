{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h1>Escanear código de barras</h1>
  <p>Apunta la cámara al código ISBN de la contraportada.</p>
</div>

<div class="scan-frame" id="scan-frame">
  <div id="reader"></div>
</div>
<p class="scan-status" id="scan-status">Iniciando cámara...</p>
<div style="text-align:center; margin-bottom:1.5rem;">
  <button id="restart-scan" class="btn btn-ghost" style="display:none;">🔄 Escanear otro</button>
</div>

<form id="book-form" class="card" method="post" action="{{ url_for('create_book') }}" style="display:none;">
  <div class="form-grid">
    <div class="field full">
      <label>Código de barras (ISBN)</label>
      <input type="text" name="isbn" id="f-isbn" readonly>
    </div>
    <div class="field full">
      <label>Título *</label>
      <input type="text" name="title" id="f-title" required>
    </div>
    <div class="field">
      <label>Autor</label>
      <input type="text" name="author" id="f-author">
    </div>
    <div class="field">
      <label>Editorial</label>
      <input type="text" name="publisher" id="f-publisher">
    </div>
    <div class="field">
      <label>Año</label>
      <input type="text" name="published_year" id="f-year">
    </div>
    <div class="field">
      <label>Ubicación</label>
      <input type="text" name="location" id="f-location" placeholder="ej. Salón, estante 2">
    </div>
  </div>
  <input type="hidden" name="cover_url" id="f-cover">
  <input type="hidden" name="description" id="f-description">
  <button type="submit" class="btn btn-primary btn-block">Guardar libro</button>
</form>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
  const reader = new Html5Qrcode("reader", { formatsToSupport: [Html5QrcodeSupportedFormats.EAN_13] });
  const frame = document.getElementById("scan-frame");
  const status = document.getElementById("scan-status");
  const form = document.getElementById("book-form");
  const restartBtn = document.getElementById("restart-scan");

  function stopScanner() {
    reader.stop().catch(() => {});
  }

  function startScanner() {
    frame.style.display = "block";
    restartBtn.style.display = "none";
    form.style.display = "none";
    status.className = "scan-status pulse";
    status.textContent = "Buscando código de barras...";
    reader.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 120 } },
      onScanSuccess
    );
  }

  async function onScanSuccess(isbn) {
    stopScanner();
    frame.style.display = "none";
    restartBtn.style.display = "inline-flex";
    status.className = "scan-status active";
    status.textContent = `Código detectado: ${isbn}. Buscando información...`;

    document.getElementById("f-isbn").value = isbn;

    try {
      const res = await fetch(`/api/lookup/${isbn}`);
      const data = await res.json();
      if (data.found) {
        document.getElementById("f-title").value = data.title || "";
        document.getElementById("f-author").value = data.author || "";
        document.getElementById("f-publisher").value = data.publisher || "";
        document.getElementById("f-year").value = data.published_year || "";
        document.getElementById("f-cover").value = data.cover_url || "";
        document.getElementById("f-description").value = data.description || "";
        status.textContent = "✅ Libro encontrado. Revisa los datos y añade la ubicación.";
      } else {
        status.textContent = "No se encontró información automática. Rellena los datos a mano.";
      }
    } catch (e) {
      status.textContent = "Error buscando información. Rellena los datos a mano.";
    }
    form.style.display = "block";
  }

  restartBtn.addEventListener("click", startScanner);
  startScanner();
</script>
{% endblock %}
