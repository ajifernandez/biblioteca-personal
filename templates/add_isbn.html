{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h1>Añadir libro por ISBN</h1>
  <p>Busca los datos automáticamente y revísalos antes de guardar.</p>
</div>

<div class="card" style="margin-bottom: 1.5rem;">
  <div class="form-grid">
    <div class="field full">
      <label for="add-isbn-input">ISBN</label>
      <input type="text" id="add-isbn-input" placeholder="978...">
    </div>
    <button type="button" id="add-lookup-btn" class="btn btn-primary">🔍 Buscar datos</button>
    <p id="add-lookup-status" class="muted" style="margin-top: 0.5rem;"></p>
  </div>
</div>

<form id="add-book-form" class="card" method="post" action="{{ url_for('books.create_book') }}" enctype="multipart/form-data">
  <div class="form-grid">
    <div class="field full">
      <label for="f-title">Título *</label>
      <input type="text" name="title" id="f-title" required>
    </div>
    <div class="field">
      <label for="f-author">Autor</label>
      <input type="text" name="author" id="f-author">
    </div>
    <div class="field">
      <label for="f-publisher">Editorial</label>
      <input type="text" name="publisher" id="f-publisher">
    </div>
    <div class="field">
      <label for="f-year">Año</label>
      <input type="text" name="published_year" id="f-year">
    </div>
    <div class="field">
      <label for="f-location">Ubicación</label>
      <input type="text" name="location" list="location-suggestions" id="f-location" placeholder="Selecciona o escribe...">
      <datalist id="location-suggestions"></datalist>
    </div>
    <div class="field">
      <label for="f-isbn">ISBN</label>
      <input type="text" name="isbn" id="f-isbn">
    </div>
    <div class="field full">
      <label>Portada</label>
      <div style="display: flex; gap: 0.75rem; align-items: flex-start;">
        <img id="edit-cover-preview" alt="" style="width: 60px; height: 90px; object-fit: cover; border-radius: 8px; background: var(--border); display: none;">
        <div style="flex: 1;">
          <input type="file" name="cover_file" id="edit-cover-file" accept="image/*" capture="environment">
          <input type="text" name="cover_url" id="f-cover" placeholder="o pega una URL de imagen" style="margin-top: 0.5rem;">
        </div>
      </div>
    </div>
    <div class="field full">
      <label for="f-description">Descripción</label>
      <textarea name="description" id="f-description" rows="4"></textarea>
    </div>
  </div>
  <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem;">
    <button type="submit" class="btn btn-primary">💾 Guardar libro</button>
    <a href="{{ url_for('pages.scan') }}" class="btn btn-ghost">📷 Escanear código</a>
  </div>
</form>

<script src="{{ url_for('static', filename='isbn-lookup.js') }}"></script>
<script>
  function fill(id, value) {
    const el = document.getElementById(id);
    if (el && value) el.value = value;
  }
  function updateCoverPreview() {
    const url = document.getElementById('f-cover').value.trim();
    const preview = document.getElementById('edit-cover-preview');
    if (url) {
      preview.src = url;
      preview.style.display = 'block';
    }
  }
  document.getElementById('add-lookup-btn').addEventListener('click', function () {
    const isbn = document.getElementById('add-isbn-input').value.trim();
    const status = document.getElementById('add-lookup-status');
    if (!isbn) {
      status.textContent = 'Escribe un ISBN.';
      return;
    }
    status.textContent = 'Buscando...';
    lookupIsbnProgressive(isbn, {
      onStatus: function (msg) { status.textContent = msg; }
    }).then(function (data) {
      if (!data || !data.found) {
        status.textContent = 'No se encontró información automática.';
        return;
      }
      fill('f-title', data.title);
      fill('f-author', data.author);
      fill('f-publisher', data.publisher);
      fill('f-year', data.published_year);
      fill('f-isbn', isbn);
      fill('f-cover', data.cover_url);
      fill('f-description', data.description);
      updateCoverPreview();
      status.textContent = '✅ Datos encontrados. Revisa y guarda.';
    }).catch(function () {
      status.textContent = 'Error buscando el ISBN.';
    });
  });
  document.getElementById('edit-cover-file').addEventListener('change', function (e) {
    if (e.target.files[0]) {
      const preview = document.getElementById('edit-cover-preview');
      preview.src = URL.createObjectURL(e.target.files[0]);
      preview.style.display = 'block';
    }
  });
  document.getElementById('f-cover').addEventListener('input', updateCoverPreview);
  fetch('/api/locations').then(function (r) { return r.json(); }).then(function (names) {
    const dl = document.getElementById('location-suggestions');
    if (dl) dl.innerHTML = names.map(function (n) { return '<option value="' + n.replace(/"/g, '&quot;') + '">'; }).join('');
  }).catch(function () {});
</script>
{% endblock %}
