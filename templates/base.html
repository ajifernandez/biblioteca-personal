<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Biblioteca personal{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <div class="topnav">
    <a class="brand" href="{{ url_for('index') }}"><span class="logo-emoji">📚</span> Mi Biblioteca</a>
    <div class="topnav-actions">
      <a class="btn btn-ghost" id="nav-locations-btn" href="{{ url_for('locations') }}" aria-label="Ubicaciones">📍<span class="btn-label"> Ubicaciones</span></a>
      <a class="btn btn-ghost" id="nav-csv-btn" href="{{ url_for('csv_page') }}" aria-label="Exportar / Importar">⇅<span class="btn-label"> CSV</span></a>
      <a class="btn btn-primary" id="nav-add-btn" href="{{ url_for('scan') }}" aria-label="Añadir libro">＋<span class="btn-label"> Añadir libro</span></a>
    </div>
  </div>
  <div class="page">
    {% block content %}{% endblock %}
  </div>
  <footer class="app-footer">
    <span>Biblioteca personal</span>
    <span class="version-badge">{{ app_version }}</span>
  </footer>
</body>
</html>
