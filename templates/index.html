{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h1>Tu biblioteca</h1>
  <p id="page-subtitle">Busca por título, ISBN, autor, ubicación o persona que tiene un préstamo.</p>
</div>

<div class="toolbar-row">
  <form class="search-card" hx-get="{{ url_for('pages.search') }}" hx-target="#results" hx-trigger="input changed delay:300ms from:input, change from:select" hx-vals="js:{view: currentView()}">
    <span class="search-icon">🔍</span>
    <input type="text" name="q" placeholder="Buscar..." autofocus>
    <select name="field" id="search-field">
      <option value="todo">Todo</option>
      <option value="titulo">Título</option>
      <option value="autor">Autor</option>
      <option value="isbn">ISBN</option>
      <option value="ubicacion">Ubicación</option>
      <option value="prestado">Prestado a</option>
      <option value="scan">📷 Escanear ISBN</option>
    </select>
  </form>
  <div class="view-toggle">
    <button type="button" id="view-grid-btn" class="btn btn-ghost" title="Vista en cuadrícula">🔲</button>
    <button type="button" id="view-table-btn" class="btn btn-ghost" title="Vista en tabla">☰</button>
  </div>
  <button type="button" id="select-toggle" class="btn btn-ghost">Seleccionar</button>
</div>

<div id="bulk-bar" class="bulk-bar" hidden>
  <div class="bulk-tabs">
    <button type="button" class="bulk-tab active" data-mode="location">📍 Ubicación</button>
    <button type="button" class="bulk-tab" data-mode="loan">🤝 Préstamo</button>
    <button type="button" class="bulk-tab" data-mode="refill">🔄 Actualizar por ISBN</button>
  </div>
  <button type="button" id="select-all" class="btn btn-ghost">Seleccionar todo</button>
  <span id="bulk-count">0 de 0 seleccionados</span>

  <div class="bulk-action" data-mode="location">
    <input type="text" id="bulk-location" name="location" placeholder="Nueva ubicación (vacío para borrarla)">
    <button
      type="button"
      id="bulk-apply-location"
      class="btn btn-primary"
      disabled
      hx-post="{{ url_for('books.bulk_update_location') }}"
      hx-target="#results"
      hx-include="#page-scope, #bulk-location, .search-card input[name='q'], .search-card select[name='field']"
      hx-vals="js:{view: currentView()}"
      hx-on::after-request="exitSelectMode()"
    >Aplicar ubicación</button>
  </div>

  <div class="bulk-action" data-mode="loan" hidden>
    <input type="text" id="bulk-borrower" name="borrower_name" placeholder="Nombre de la persona">
    <button
      type="button"
      id="bulk-apply-loan"
      class="btn btn-primary"
      disabled
      hx-post="{{ url_for('books.bulk_create_loan') }}"
      hx-target="#results"
      hx-include="#page-scope, #bulk-borrower, .search-card input[name='q'], .search-card select[name='field']"
      hx-vals="js:{view: currentView()}"
      hx-on::after-request="exitSelectMode()"
    >Prestar</button>
  </div>

  <div class="bulk-action" data-mode="refill" hidden>
    <span id="bulk-refill-status" class="muted"></span>
    <button type="button" id="bulk-apply-refill" class="btn btn-primary" disabled>Actualizar por ISBN</button>
  </div>

  <button type="button" id="bulk-cancel" class="btn btn-ghost">Cancelar</button>
</div>

<div id="page-scope">
  <div id="results">
    <div class="empty-state pulse"><div class="icon">📖</div><p>Cargando tu biblioteca...</p></div>
  </div>
</div>

<div id="scan-overlay" class="scan-overlay" hidden>
  <div class="scan-overlay-inner">
    <button type="button" id="scan-overlay-close" class="btn btn-ghost scan-overlay-close" aria-label="Cerrar">✕</button>
    <div class="scan-frame" id="search-scan-frame"><div id="search-reader"></div></div>
    <p class="scan-status" id="search-scan-status">Iniciando cámara...</p>
  </div>
</div>

<script>
  function currentView() {
    return localStorage.getItem('bookView') || 'grid';
  }

  function applyViewButtons() {
    var v = currentView();
    document.getElementById('view-grid-btn').classList.toggle('active', v === 'grid');
    document.getElementById('view-table-btn').classList.toggle('active', v === 'table');
  }

  function reloadResults() {
    var form = document.querySelector('.search-card');
    var params = new URLSearchParams(new FormData(form));
    params.set('view', currentView());
    return htmx.ajax('GET', '{{ url_for("pages.search") }}?' + params.toString(), { target: '#results', swap: 'innerHTML' });
  }

  function setView(mode) {
    localStorage.setItem('bookView', mode);
    applyViewButtons();
    reloadResults();
  }

  var scanOverlay = document.getElementById('scan-overlay');
  var scanOverlayStatus = document.getElementById('search-scan-status');
  var qrLibPromise = null;
  var searchReader = null;

  function loadQrLib() {
    if (qrLibPromise) return qrLibPromise;
    qrLibPromise = new Promise(function (resolve, reject) {
      if (window.Html5Qrcode) return resolve();
      var script = document.createElement('script');
      script.src = 'https://unpkg.com/html5-qrcode';
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
    return qrLibPromise;
  }

  function closeScanOverlay() {
    scanOverlay.hidden = true;
    if (searchReader) {
      searchReader.stop().catch(function () {});
      searchReader = null;
    }
  }

  function onSearchScanSuccess(isbn) {
    closeScanOverlay();
    var qInput = document.querySelector('.search-card input[name="q"]');
    fieldSelect.value = 'isbn';
    lastFieldValue = 'isbn';
    qInput.value = isbn;
    reloadResults();
  }

  function openScanOverlay() {
    scanOverlay.hidden = false;
    scanOverlayStatus.textContent = 'Iniciando cámara...';
    loadQrLib().then(function () {
      searchReader = new Html5Qrcode('search-reader', { formatsToSupport: [Html5QrcodeSupportedFormats.EAN_13] });
      return searchReader.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 120 } },
        onSearchScanSuccess
      );
    }).then(function () {
      scanOverlayStatus.textContent = 'Buscando código de barras...';
    }).catch(function () {
      scanOverlayStatus.textContent = 'No se pudo acceder a la cámara.';
    });
  }

  document.getElementById('scan-overlay-close').addEventListener('click', closeScanOverlay);

  var fieldSelect = document.getElementById('search-field');
  var lastFieldValue = fieldSelect.value;
  fieldSelect.addEventListener('change', function (e) {
    if (fieldSelect.value === 'scan') {
      e.stopImmediatePropagation();
      fieldSelect.value = lastFieldValue;
      openScanOverlay();
      return;
    }
    lastFieldValue = fieldSelect.value;
  });

  document.getElementById('view-grid-btn').addEventListener('click', function () { setView('grid'); });
  document.getElementById('view-table-btn').addEventListener('click', function () { setView('table'); });

  function loadInitialResults() {
    var urlParams = new URLSearchParams(window.location.search);
    var q = urlParams.get('q') || '';
    var field = urlParams.get('field') || 'todo';

    var qInput = document.querySelector('.search-card input[name="q"]');
    var fieldSelect = document.querySelector('.search-card select[name="field"]');
    if (q) qInput.value = q;
    if (Array.prototype.some.call(fieldSelect.options, function (o) { return o.value === field; })) {
      fieldSelect.value = field;
    }
    if (field === 'sin_ubicacion') {
      document.getElementById('page-subtitle').textContent = 'Mostrando libros sin ubicación asignada.';
    } else if (field === 'ubicacion' && q) {
      document.getElementById('page-subtitle').textContent = 'Mostrando libros en «' + q + '».';
    }

    var params = new URLSearchParams();
    params.set('q', q);
    params.set('field', field);
    params.set('view', currentView());
    htmx.ajax('GET', '{{ url_for("pages.search") }}?' + params.toString(), { target: '#results', swap: 'innerHTML' });
  }

  applyViewButtons();
  loadInitialResults();

  document.body.addEventListener('htmx:afterSwap', function (e) {
    if (e.detail.target && e.detail.target.id === 'results') updateBulkBar();
  });

  document.addEventListener('click', function (e) {
    var row = e.target.closest('.book-row');
    if (!row || document.body.classList.contains('select-mode') || row.tagName !== 'TR') return;
    if (e.target.closest('input')) return;
    window.location = row.dataset.href;
  });

  function updateBulkBar() {
    var boxes = document.querySelectorAll('#results input[name="book_ids"]');
    var n = Array.prototype.filter.call(boxes, function (cb) { return cb.checked; }).length;
    document.getElementById('bulk-count').textContent = n + ' de ' + boxes.length + ' seleccionados';
    document.getElementById('bulk-apply-location').disabled = n === 0;
    document.getElementById('bulk-apply-loan').disabled =
      n === 0 || document.getElementById('bulk-borrower').value.trim() === '';
    document.getElementById('bulk-apply-refill').disabled = n === 0;
    document.getElementById('select-all').textContent =
      boxes.length > 0 && n === boxes.length ? 'Deseleccionar todo' : 'Seleccionar todo';
  }

  function setBulkMode(mode) {
    document.querySelectorAll('.bulk-tab').forEach(function (tab) {
      tab.classList.toggle('active', tab.dataset.mode === mode);
    });
    document.querySelectorAll('.bulk-action').forEach(function (group) {
      group.hidden = group.dataset.mode !== mode;
    });
  }

  document.querySelectorAll('.bulk-tab').forEach(function (tab) {
    tab.addEventListener('click', function () { setBulkMode(tab.dataset.mode); });
  });

  document.getElementById('bulk-borrower').addEventListener('input', updateBulkBar);

  document.getElementById('bulk-apply-refill').addEventListener('click', async function () {
    var button = this;
    var statusEl = document.getElementById('bulk-refill-status');
    var ids = Array.prototype.map.call(
      document.querySelectorAll('#results input[name="book_ids"]:checked'),
      function (cb) { return cb.value; }
    );
    if (!ids.length) return;

    button.disabled = true;
    document.getElementById('select-all').disabled = true;
    var applied = 0, noIsbn = 0, noMatch = 0;

    for (var i = 0; i < ids.length; i++) {
      statusEl.textContent = 'Actualizando ' + (i + 1) + ' de ' + ids.length + '...';
      try {
        var res = await fetch('/books/' + ids[i] + '/refill', { method: 'POST' });
        var data = await res.json();
        if (data.applied) applied++;
        else if (data.reason === 'no_isbn') noIsbn++;
        else noMatch++;
      } catch (e) {
        noMatch++;
      }
    }

    statusEl.textContent = '✅ ' + applied + ' actualizados'
      + (noMatch ? ', ' + noMatch + ' sin resultados' : '')
      + (noIsbn ? ', ' + noIsbn + ' sin ISBN' : '') + '.';
    await reloadResults();
    button.disabled = false;
    document.getElementById('select-all').disabled = false;
    updateBulkBar();
  });

  function exitSelectMode() {
    document.body.classList.remove('select-mode');
    document.getElementById('bulk-bar').hidden = true;
    document.getElementById('select-toggle').textContent = 'Seleccionar';
    document.getElementById('bulk-location').value = '';
    document.getElementById('bulk-borrower').value = '';
    document.getElementById('bulk-refill-status').textContent = '';
    document.getElementById('select-all').disabled = false;
    setBulkMode('location');
    document.querySelectorAll('#results input[name="book_ids"]:checked').forEach(function (cb) {
      cb.checked = false;
    });
    document.querySelectorAll('.book-row.selected').forEach(function (c) {
      c.classList.remove('selected');
    });
    updateBulkBar();
  }

  document.getElementById('select-toggle').addEventListener('click', function () {
    var active = document.body.classList.toggle('select-mode');
    document.getElementById('bulk-bar').hidden = !active;
    this.textContent = active ? 'Cancelar selección' : 'Seleccionar';
    if (active) updateBulkBar();
    else exitSelectMode();
  });

  document.getElementById('bulk-cancel').addEventListener('click', exitSelectMode);

  document.getElementById('select-all').addEventListener('click', function () {
    var boxes = document.querySelectorAll('#results input[name="book_ids"]');
    var allChecked = boxes.length > 0 && Array.prototype.every.call(boxes, function (cb) { return cb.checked; });
    boxes.forEach(function (cb) {
      cb.checked = !allChecked;
      var row = cb.closest('.book-row');
      if (row) row.classList.toggle('selected', cb.checked);
    });
    updateBulkBar();
  });

  document.addEventListener('click', function (e) {
    if (!document.body.classList.contains('select-mode')) return;
    var row = e.target.closest('.book-row');
    if (!row) return;
    e.preventDefault();
    var checkbox = row.querySelector('input[name="book_ids"]');
    checkbox.checked = !checkbox.checked;
    row.classList.toggle('selected', checkbox.checked);
    updateBulkBar();
  });

  document.addEventListener('change', function (e) {
    if (!e.target || e.target.name !== 'book_ids') return;
    var row = e.target.closest('.book-row');
    if (row) row.classList.toggle('selected', e.target.checked);
    updateBulkBar();
  });
</script>
{% endblock %}
